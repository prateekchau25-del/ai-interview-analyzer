# docker compose up --build      ->  UI http://localhost:8501   API http://localhost:8000/docs
# Put LLM_API_KEY (and optionally POSTGRES_PASSWORD) in a .env file next to this file.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: interview_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 5433 on the host so it does not clash with a local PostgreSQL / pgAdmin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_ai"]
      interval: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/interview_ai
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_API_KEY: ${LLM_API_KEY:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - appdata:/app/data
      - models:/models-cache
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      retries: 30

  ui:
    build: .
    command: ["streamlit", "run", "frontend/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - models:/models-cache
      - visionmodels:/app/ml/models/vision
    ports:
      - "8501:8501"

volumes:
  pgdata:
  appdata:
  models:
  visionmodels:
