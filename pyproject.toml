[project]
name = "ai-interview-analyzer"
version = "0.1.0"
requires-python = ">=3.11,<3.13"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["backend/app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
